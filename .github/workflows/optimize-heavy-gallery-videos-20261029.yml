name: Create lightweight web copies of heavy portfolio videos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-heavy-gallery-videos-20261029.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Preserve originals and encode browser-friendly copies of files above 5MB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, glob, json, os, pathlib
          files=sorted(glob.glob('assets/2d/*.mp4')+glob.glob('assets/3d/*.mp4')+glob.glob('assets/ai/*.mp4'))
          for src in files:
            n=os.path.getsize(src)
            if n<5000000: continue
            meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','json',src]))
            w,h=meta['streams'][0]['width'],meta['streams'][0]['height']
            ratio=min(1,1600/max(w,h))
            nw=max(2,int(w*ratio)//2*2)
            nh=max(2,int(h*ratio)//2*2)
            target=str(pathlib.Path(src).parent/'web'/pathlib.Path(src).name)
            pathlib.Path(target).parent.mkdir(parents=True,exist_ok=True)
            cmd=['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y','-i',src,'-map','0:v:0','-map','0:a?','-vf',f'scale={nw}:{nh}','-c:v','libx264','-preset','veryfast','-crf','21','-pix_fmt','yuv420p','-c:a','aac','-b:a','160k','-movflags','+faststart',target]
            subprocess.run(cmd,check=True)
            dstsize=os.path.getsize(target)
            print(json.dumps({'file':src,'web':target,'originalBytes':n,'webBytes':dstsize,'size':f'{nw}x{nh}'},ensure_ascii=False),flush=True)
            if dstsize>=n*0.95:
              os.unlink(target)
              print(f'No meaningful saving for {src} - original will be used',flush=True)
          PY
      - name: Publish web variants without modifying original works
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/2d/web/ assets/3d/web/ assets/ai/web/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add compact H264 web previews of heavy portfolio works"
            git pull --rebase origin main
            git push origin main
          fi