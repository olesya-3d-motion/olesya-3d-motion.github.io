name: Install approved BAZÉ AI campaign photographs
on:
  push:
    paths:
      - '.github/workflows/install-baze-ai-final-20261109.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-approved-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact approved portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify archive and restore four final WEBP images
        shell: bash
        run: |
          set -euo pipefail
          echo '201b7f98c184c9d832bd24cb1cbeab92a5931475499fffeaa676c86b14bd33ce  assets/baze-ai/_approved-images-20261109.zip' | sha256sum --check
          unzip -t assets/baze-ai/_approved-images-20261109.zip >/dev/null
          unzip -o -q assets/baze-ai/_approved-images-20261109.zip -d .
          for i in 01 02 03 04; do
            test -s "assets/baze-ai/baze-ai-${i}.webp"
            file "assets/baze-ai/baze-ai-${i}.webp"
          done
      - name: Commit new approved photographs and remove temporary installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/baze-ai/baze-ai-01.webp assets/baze-ai/baze-ai-02.webp assets/baze-ai/baze-ai-03.webp assets/baze-ai/baze-ai-04.webp
          git rm assets/baze-ai/_approved-images-20261109.zip .github/workflows/install-baze-ai-final-20261109.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Publish four approved final BAZÉ beauty campaign photographs'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
