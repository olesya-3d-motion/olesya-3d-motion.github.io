name: Lighten 3D card texture for fast loading
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-3d-card-grain.yml'
permissions:
  contents: write
jobs:
  webp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Convert grain to efficient WebP while preserving original PNG
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/3d-card-grain.png
          ffmpeg -nostdin -hide_banner -loglevel error -y -i assets/3d-card-grain.png -frames:v 1 -vf "scale='min(1000,iw)':-2" -c:v libwebp -quality 80 -compression_level 6 assets/3d-card-grain.webp
          test -s assets/3d-card-grain.webp
          echo "Original PNG bytes: $(stat -c%s assets/3d-card-grain.png)"
          echo "New WebP bytes: $(stat -c%s assets/3d-card-grain.webp)"
      - name: Publish web-optimized texture only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d-card-grain.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add lightweight WebP grain texture for 3D card"
            git pull --rebase origin main
            git push origin main
          fi