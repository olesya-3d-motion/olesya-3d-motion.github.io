name: Upload Houses to 2D portfolio

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/add-houses-2d.yml

permissions:
  contents: write

jobs:
  upload-houses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check gdown
      - name: Download video and selected poster
        shell: bash
        run: |
          set -euo pipefail
          gdown "1pQfByb5A4EdUw3ZOdVaop0dPsjzeYEl8" -O /tmp/houses-2d.zip
          unzip -t /tmp/houses-2d.zip >/dev/null
          unzip -o -q /tmp/houses-2d.zip -d .
          test -s assets/2d/houses.mp4
          test -s assets/2d/houses.webp
      - name: Commit Houses media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/2d/houses.mp4 assets/2d/houses.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add Houses motion video and cover to 2D portfolio"
            git push
          fi
