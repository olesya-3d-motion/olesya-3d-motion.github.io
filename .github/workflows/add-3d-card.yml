name: Install 3D card animation assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/add-3d-card.yml

permissions:
  contents: write

jobs:
  add-3d-card-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Install download utility
        run: python -m pip install --disable-pip-version-check gdown
      - name: Download Olesya's original 3D figure and textured background
        shell: bash
        run: |
          set -euo pipefail
          gdown "1bZ4rQsdtion2EbEa6fkesN7EmVpszHR8" -O /tmp/olesya-3d-card.zip
          unzip -t /tmp/olesya-3d-card.zip > /dev/null
          unzip -o -q /tmp/olesya-3d-card.zip -d .
          test -s assets/3d-card-figure-alpha.webm
          test -s assets/3d-card-figure-still.png
          test -s assets/3d-card-grain.png
      - name: Commit 3D cover media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d-card-figure-alpha.webm assets/3d-card-figure-still.png assets/3d-card-grain.png
          if ! git diff --cached --quiet; then
            git commit -m "Add original translucent 3D figure animation and Dusk grain background"
            git push
          fi
