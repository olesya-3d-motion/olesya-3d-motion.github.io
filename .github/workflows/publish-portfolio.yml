name: Publish Olesya Portfolio v7

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-portfolio.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out portfolio repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download and unpack seven v7 bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/olesya-portfolio
          file_ids=(
            17x3z2Qt6gfh2WDQTaMsGtX6CapAI3uBs
            1iYT9_KpHreIHMPKyJU4KL-oozG2NBACH
            13L54X8QAgLlsYAYAD73Hbhl_0X2ixh2v
            1mMJiIJpArIq_0pVGVkgzxaAhVty4JG8C
            1mPLYeLS4s7qLFTKn2zmelyCsa1cMcI4n
            1y_isrbZFP-joB93cReToBM19gQlee3kc
            1sr4nzSm_eYMY9GqJxi10FxZ2p-LEn_rb
          )
          for index in "${!file_ids[@]}"; do
            id="${file_ids[$index]}"
            archive="/tmp/olesya-${index}.zip"
            echo "::group::Download bundle $((index + 1))"
            gdown --id "$id" -O "$archive" --quiet
            unzip -q -o "$archive" -d /tmp/olesya-portfolio
            rm "$archive"
            echo "::endgroup::"
          done

      - name: Install v7 website files
        shell: bash
        run: |
          set -euo pipefail
          source_dir=/tmp/olesya-portfolio/Olesya_Portfolio_v7
          test -f "$source_dir/index.html"
          test -f "$source_dir/assets/banner.mp4"
          test -f "$source_dir/assets/2d/beach-tours.mp4"
          test -f "$source_dir/assets/3d/green-interior.mp4"
          cp -a "$source_dir/." .
          touch .nojekyll
          echo "Site files and media installed"

      - name: Commit and publish portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html script.js styles.css assets/ directions/ projects/ .nojekyll
          if git diff --cached --quiet; then
            echo "Portfolio already up to date"
          else
            git commit -m "Publish Olesya Portfolio v7 with 2D and 3D galleries"
            git push
          fi
