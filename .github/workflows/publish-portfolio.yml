name: Publish Olesya Portfolio v7

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-portfolio.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out portfolio repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install downloader
        id: install
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download and unpack v7
        id: download
        shell: bash
        run: |
          set -euo pipefail
          echo "Started download" > publish-report.txt
          mkdir -p /tmp/olesya-portfolio
          file_ids=(
            17x3z2Qt6gfh2WDQTaMsGtX6CapAI3uBs
            1iYT9_KpHreIHMPKyJU4KL-oozG2NBACH
            13L54X8QAgLlsYAYAD73Hbhl_0X2ixh2v
            1mMJiIJpArIq_0pVGVkgzxaAhVty4JG8C
            1mPLYeLS4s7qLFTKn2zmelyCsa1cMcI4n
            1y_isrbZFP-joB93cReToBM19gQlee3kc
            1sr4nzSm_eYMY9GqJxi10FxZ2p-LEn_rb
          )
          for index in "${!file_ids[@]}"; do
            id="${file_ids[$index]}"
            archive="/tmp/olesya-${index}.zip"
            echo "Downloading part $((index + 1))" | tee -a publish-report.txt
            if ! gdown "$id" -O "$archive" --quiet 2> /tmp/download-error.txt; then
              echo "ERROR: Download failed for part $((index + 1))" | tee -a publish-report.txt
              head -c 4000 /tmp/download-error.txt | tee -a publish-report.txt
              exit 1
            fi
            echo "Downloaded $((index + 1)): $(stat -c%s "$archive") bytes" | tee -a publish-report.txt
            if ! unzip -t "$archive" > /tmp/unzip-check.txt 2>&1; then
              echo "ERROR: ZIP integrity failed for part $((index + 1))" | tee -a publish-report.txt
              tail -n 20 /tmp/unzip-check.txt | tee -a publish-report.txt
              exit 1
            fi
            unzip -q -o "$archive" -d /tmp/olesya-portfolio
            rm "$archive"
          done

      - name: Install website
        id: install_site
        shell: bash
        run: |
          set -euo pipefail
          source_dir=/tmp/olesya-portfolio/Olesya_Portfolio_v7
          test -f "$source_dir/index.html"
          test -f "$source_dir/assets/banner.mp4"
          test -f "$source_dir/assets/2d/beach-tours.mp4"
          test -f "$source_dir/assets/3d/green-interior.mp4"
          cp -a "$source_dir/." .
          touch .nojekyll
          echo "All portfolio assets copied successfully" | tee -a publish-report.txt

      - name: Commit website files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html script.js styles.css assets/ directions/ projects/ .nojekyll
          echo "Publish complete" >> publish-report.txt
          if git diff --cached --quiet; then
            echo "Website already up to date"
          else
            git commit -m "Publish complete Olesya Portfolio v7"
            git push
          fi

      - name: Save deployment diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "Download outcome: ${{ steps.download.outcome }}"
            echo "Install outcome: ${{ steps.install.outcome }}"
            echo "Site install outcome: ${{ steps.install_site.outcome }}"
            echo "Publish outcome: ${{ steps.publish.outcome }}"
          } >> publish-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record portfolio deploy diagnostics"
            git push
          fi
